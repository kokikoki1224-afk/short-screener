name: daily-short-screener

on:
  schedule:
    - cron: "30 8 * * 1-5"   # 17:30 JST 平日(休場日は main.py が判定して終了)
  workflow_dispatch:
    inputs:
      date:
        description: "公表日 YYYY-MM-DD (空なら今日)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_site: ${{ steps.chk.outputs.has_site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          WEEKLY_MARGIN_URL: ${{ vars.WEEKLY_MARGIN_URL }}
        run: python -m src.main ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: out/
          if-no-files-found: ignore
      - id: chk
        run: |
          if [ -f out/site/index.html ]; then echo "has_site=true" >> "$GITHUB_OUTPUT"; else echo "has_site=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.chk.outputs.has_site == 'true'
        with:
          path: out/site

  deploy:
    needs: run
    if: needs.run.outputs.has_site == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
